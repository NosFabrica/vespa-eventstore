[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.0"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# 875531afb0 = amethyst PR #3881 (2026-08-09), 23 commits. Quartz's share is 37
# files in four areas, and this store imports from none of them:
#
#   concord/ (cord02, cord04, cord05, cord06, crypto, envelope) — CORD-02 §2's
#     staff-held control_root write gate, plus a control-plane key split; two new
#     files (ControlRootWrap, ControlPlaneKeys). No new event kinds in the range.
#   nip01Core/relay/client/accessories — SyncCoverage's `complete` moved OFF Band
#     onto Span, i.e. per kind, because `legs()` hands each kind group its own ask
#     and a walk that drained `kinds: [10002]` was claiming kind 0 too; Band.complete
#     survives as a derived `all { it.complete }` for the state files. fetchAllPages
#     now RETURNS a drained outcome instead of signalling by callback. Source-breaking
#     for SyncCoverage/fetchAllPages callers, of which the only in-range one is
#     geode's SyncCoverageFile, updated in the same PR.
#   nip01Core/relay/client/single/basic/BasicRelayClient — OkHttp spells it
#     "Canceled" with one L, so the "Cancelled" comparison never matched and
#     client-initiated cancels were inflating the relay.connfails counter.
#   nip66RelayMonitor/reachability — probe verdicts now merge into the record they
#     replace instead of rebuilding it, with ownership/guard/timestamp rules.
#   Plus one warning cleanup in relay/server/policies/LimitsPolicy (`it.limit!!` →
#     `it.limit`); no behaviour, and Filter itself is untouched.
#
# All of that is relay client/server plumbing and Concord group crypto, none of
# which this store is: grep finds no reference to SyncCoverage, fetchAllPages,
# LimitsPolicy, nip66 or Concord in any module here. Nothing under nip01Core/store,
# nip50Search, nip01Core/relay/filters or nip85TrustedAssertions was touched at all;
# IEventStore, SQLiteEventStore, IndexableFields, SearchFieldExtractor and
# SearchQuery are byte-identical to the previous pin, and the SearchableEvent set is
# the same 129 files. The store contract, filter semantics and the searchable-kind
# table carry over unchanged, so the parity and rank gates are unaffected. No build
# or dependency file moved in the range either — quartz/build.gradle.kts and the
# root version catalog are untouched, so nothing transitive shifts under us. The
# rest of the range is app-side (relay churn/traffic usage counters, Concord UI and
# CLI, Crowdin translations). We take it to stay on head, not for anything it gives
# this store.
#
# Prev f4640b6ea1 (2026-08-07, PR #3877: SyncCoverage's per-(relay, filter) map key
# became a typed BandKey instead of a "$url $filterJson" string that copied and
# rehashed the filter's json on every lookup; same relay-client bookkeeping, equally
# unused here).
# This range touched no skill files, so the .claude/skills imported at 9231195890
# are current for this pin.
quartz = "875531afb0"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
