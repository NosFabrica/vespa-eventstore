# this store reads `emoji` TAGS, not that string form.
#
# Prev 68268da413 (2026-10-06: the hint-provider / NIP-50 / tag-relationship series; 42 kinds
# newly searchable and 19 extracting differently, repaired by a kind-scoped walk over 61 kinds;
# EventFactory builds 31890 and 10044; tag relay slots parse strictly, inert here).
# Prev d792ebc4bf (2026-10-05: amethyst #4325; kind 38000 split by tags, decentralized lists'
# text tier, NIP-62 relay compared normalized, 30394 member `a` coordinate-shaped; repaired by
# reindexFullTextSearch(listOf(38000, 30267, 9998, 9999, 39998, 39999))).
# Prev fcd76d2075 (2026-09-27: amethyst #4231, NIP-FE's published form, RelaySession,
# NIP-49; nothing this store called moved, pinned for vespa-relay).
# Prev a53cafd577 (2026-09-27: amethyst #4214, NIP-FE's review fixes; nothing this store called
# moved, pinned for the relay the same way).
# Prev ec16988e3a (2026-09-27: amethyst #4222 returned Quartz's SQLite store to REPLACED,
# `replaced:` / OK false, for a stale replaceable, which this store never left; #4215 before it
# (1cfb6e922f) gave decentralized lists, text tracks and release notes their own extractor
# branches, derived data a corpus picks up with reindexFullTextSearch()).
# Prev 28bf170f92 (2026-09-26: event classes renamed to their NIP names; Quartz's SQLite
# store answered a stale replaceable with SUPERSEDED, `duplicate:` / OK true, which this store
# did not follow and ec16988e3a reverted upstream; 142 -> 150 reachable
# searchable kinds, eight new classes on the catch-all; jackson-module-kotlin and kotlin-reflect leave
# the classpath).
# Prev a8e8778265 (2026-09-10: 133 -> 144 searchable kind values, all eleven on the
# catch-all; SearchableEvent grows the read-path forEachIndexableField, no reindex).
# Prev cecc3287b2 (2026-09-01: 17 catch-all kinds split into title/body roles, four
# affiliation URLs, six doubled `t`-tag scans dropped; a ranking backfill).
quartz = "ce558d9"
coroutines = "1.11.0"
serialization = "1.12.0"
# Matches what Quartz brings transitively; Gradle would resolve to it regardless.
sqlite = "2.7.1"
# Likewise Quartz's own okhttp line (it already was, at the previous pin).
okhttp = "5.5.1"
ktor = "3.6.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.781.11"
# The container API the :bundle request handler compiles against (compile-only: Vespa provides it
# at runtime). Only stable public API is used, so the bundle runs on any Vespa 8 container.
vespa-container = "8.781.11"
# Lucene's analysis module, for its Portuguese and Spanish LIGHT stemmers (Savoy's,
# the ones Lucene's own analyzers use) — engine/text/StemText. Apache-2.0 (checked
# against the published POM); pulls in lucene-core. HELD ON 9.x: Lucene 10 makes both stemmer
# classes package-private, reachable only through their TokenFilters. 9.12.3 is the line's last
# patch and the one Vespa's own parent POM pins (lucene.vespa.version, 8.781.11).
lucene = "9.12.3"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks:
# jetty.vespa.version in com.yahoo.vespa:parent at the vespa-feed version above.
jetty = "12.0.40"
spotless = "8.11.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "2.0.5"

