[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.1"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# a8e8778265 = amethyst main @ 2026-09-10. NOT bumped for this store, for once:
# the range is upstream's own work, and everything this store reads out of it is
# byte-identical. IEventStore, SQLiteEventStore, Filter, SearchQuery,
# SearchFieldExtractor and IndexableFields do not have one changed line between
# the two pins, so filter semantics, the parity gate, and the per-kind
# DECOMPOSITION the last two bumps were about all hold exactly as they were.
#
# The range is 220 commits; two things in it reach this store.
#
#   SearchableEvent grows a READ path. `forEachIndexableField(visitor)` hands over
#     the same fields `indexableContent()` joins, without building the joined
#     string — for Amethyst's per-keystroke scan of the whole cache, where a
#     string per event per keystroke is not affordable. It and
#     `indexableSeparator()` are both DEFAULTED on the interface, and every
#     override the range adds re-expresses a join that already existed: no
#     `indexableContent()` body moved (the range removes no line mentioning one),
#     and this store only ever calls the WRITE path, through SearchFieldExtractor.
#     Upstream added `IndexableContentGoldenTest` and an `indexable-content.golden`
#     resource in the same range to keep it that way. So: nothing to implement
#     here, and NO REINDEX — every kind already stored indexes the same words on
#     the same columns as before.
#
#   The searchable SET moves, for the first time in several bumps: 133 -> 144 kind
#     values (130 -> 141 classes). SearchFieldExtractor gained no branch for any of
#     the 11, so all of them land in its `is SearchableEvent ->` catch-all — the
#     whole `indexableContent()` in the BODY role, titles included. That is the
#     same 236x title discount the last two bumps fixed for 19 other kinds, and it
#     takes the same fix (one branch each, upstream). Left as a note rather than
#     held for, because it is a RANKING gap on kinds a relay has almost none of
#     yet, not a recall one. The 11, with what their catch-all body carries:
#       31 / 32 / 33   external / hardcopy / prompt citation   title, summary, content
#       818            wiki merge request                      content
#       30040          publication index                       title, author, summary
#       30041          publication content                     title, content
#       30045          bookshelf directory                     title, summary, content
#       30142          learning resource                       title, summary, content
#       31987          relay review                            content
#       32176          Blossom piece index                     title, summary, content
#       34259          entity rating                           content
#     Recall on these is FORWARD-ONLY until `reindexFullTextSearch()` runs: events
#     of those kinds already stored carry NO search fields, because when they were
#     ingested nothing parsed them as searchable at all. Unlike the last two bumps'
#     backfill, this one changes what is FINDABLE rather than how it ranks, so it
#     is the one worth actually scheduling.
#
# Prev cecc3287b2 (2026-09-01: 17 catch-all kinds split into title/body roles, four
# affiliation URLs, six doubled `t`-tag scans dropped; a ranking backfill).
quartz = "a8e8778265"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
