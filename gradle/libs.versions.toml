[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.0"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# 35f96a936d = amethyst PR #3872 (2026-08-06). The whole range is TWO files, both
# in nip01Core/relay/client/pool: PoolEventOutbox and a new scale test for it. The
# outbox kept pending publishes in an immutable map rebuilt per send, so N
# publishes copied 1+2+…+N (measured ~20.5ms of a 22.7ms/event budget at ~970k
# entries resident, decaying as the backlog grew); it is now a LargeCache
# (ConcurrentHashMap on JVM) with the relay set maintained asymmetrically —
# additions exact, removals swept every 256 and whenever the outbox empties.
#
# That is the relay client, which this store is not: we hold no outbox, and grep
# finds no reference to PoolEventOutbox or anything under relay/client/pool. All
# of it is private to the class besides — every public signature on PoolEventOutbox
# is unchanged, so the range is not even source-breaking for callers that DO use
# it. IEventStore, SQLiteEventStore, IndexableFields and SearchFieldExtractor are
# byte-identical to the previous pin; nothing under nip01Core/store or nip50Search
# was touched at all. The store contract, filter semantics and the searchable-kind
# table carry over unchanged, and the parity and rank gates are unaffected. We take
# it to stay on head, not for anything it gives this store.
#
# Prev 7caf4a8a25 (2026-08-06, PRs #3866/#3868/#3869/#3870/#3871: #3871 landed the
# windowed negentropy sync this store was built to feed — NegentropyLocalIndex
# answers one window at a time, NegErrMessage reads a relay's size cap off its own
# refusal — both mapping onto count / snapshotIdsForNegentropy; wiring an adapter
# is still a follow-up. The rest was app-side). This range touched no skill files,
# so the .claude/skills imported at 9231195890 are current for this pin.
quartz = "35f96a936d"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
