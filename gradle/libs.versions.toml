[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.1"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# 28bf170f92 = amethyst main @ 2026-09-26. 958 commits; four things in it reach this store.
#
#   Event classes renamed to their NIP names (upstream 6d2c37c346). The ones this store
#     names: ContactCardEvent -> UserAssertionEvent (30382), DeletionEvent ->
#     DeletionRequestEvent (5), LongTextNoteEvent -> LongFormContentEvent (30023),
#     peopleList.PeopleListEvent -> followSet.FollowSetEvent (30000), and
#     followList.FollowListEvent -> starterPack.StarterPackEvent (39089). The old names
#     survive as @Deprecated typealiases; this bump moves every reference off them anyway.
#     Kinds, tags and parsing are unchanged, so the trust projection and the deletion
#     path read exactly what they read before.
#
#   A stale replaceable/addressable version is now RejectionReason.SUPERSEDED,
#     "duplicate: a newer version ...", in SQLiteEventStore (STORE-W01/W02; W09 is new).
#     Quartz's RelaySession acks every `duplicate:` reason with OK true and everything else
#     with OK false, so this store's old "replaced:" made a relay built on it answer
#     OK false to a routine same-second re-publish. That is the loop MDK's `wn` retried
#     forever against geode. Rejections.SUPERSEDED replaces REPLACED on both
#     admission paths, which keeps the outcome tally's key set closed and matches the reference.
#
#   The searchable set moves again: 144 -> 150 reachable kind values. Eight NEW
#     classes are searchable, and all eight take SearchFieldExtractor's catch-all (the
#     whole indexableContent() in the BODY role, titles included, the same ranking
#     gap as the previous pin's eleven; README's kind table marks both sets with a dagger):
#       7516 / 37516 / 37517   NIP-CC geocache found log / listing / curation list
#       9998 / 39998           decentralized list header (hashtags index twice, see README)
#       9999 / 39999           decentralized list item   (likewise)
#       39307                  NIP-71 video text track (raw WebVTT, cue timings included)
#     They are new classes, not new implementors of old ones. Until this pin the factory
#     parsed those kinds as plain events, so everything already stored under them has no
#     search fields: recall is FORWARD-ONLY until `reindexFullTextSearch()` runs, like
#     last time. 31890 (FeedDefinitionEvent) implements SearchableEvent but was never
#     registered in EventFactory, at this pin or the last; README listed it, and no
#     longer does. Upstream now keeps the reachable set as SearchableKinds.ALL, swept by
#     a test over all 65536 kinds, and the searchable-events skill's table is checked
#     against it. No existing kind's indexableContent() moved (the golden file's diff is
#     additions only) except 30063. That one now also joins a NIP-82 release's notes, and
#     the extractor's branch for it does not, so here those notes stay unindexed (README).
#
#   Transitively: Quartz now exports jackson-databind instead of jackson-module-kotlin,
#     and kotlin-reflect leaves the classpath with it. Nothing in main here binds through
#     Jackson or reflects on Kotlin classes; two tests that listed members through
#     `KClass.members` now ask java.lang.Class instead. Also kotlin-stdlib 2.4.20
#     (upstream's Kotlin, one patch past this build's 2.4.0 compiler, same 2.4 metadata)
#     and androidx sqlite 2.7.1. okhttp 5.5.0 was already what the last pin brought.
#
# Prev a8e8778265 (2026-09-10: 133 -> 144 searchable kind values, all eleven on the
# catch-all; SearchableEvent grows the read-path forEachIndexableField, no reindex).
# Prev cecc3287b2 (2026-09-01: 17 catch-all kinds split into title/body roles, four
# affiliation URLs, six doubled `t`-tag scans dropped; a ranking backfill).
quartz = "28bf170f92"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
