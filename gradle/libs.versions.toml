[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.0"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# 1866007e99 = amethyst PR #3908 (2026-08-12), 6 commits — the narrowest range we
# have taken. Nine quartz files, all of them the relay READ accessories the previous
# pin taught NIP-42, plus one KDoc paragraph in relay/client/auth. It finishes that
# work by taking three things away and handing one back:
#
#   `maxTotalMs` is gone from `fetchAll`/`fetchAllWithHooks`. The wall-clock ceiling
#     could not tell a relay legitimately streaming a large backlog from one that
#     will never finish, so it cut both; a hard deadline now composes at the call
#     site (`withTimeoutOrNull(ms) { fetchAll(…) }`), which is where every other
#     accessory already put it — `fetchAllPages` never had one.
#   Cancellation is therefore the only wall-clock bound, so the drain loop learns to
#     observe it. Nothing on its fast path suspends — `tryReceive` doesn't, and a
#     suspend hook that completes without suspending performs no cancellation check
#     — so a relay feeding faster than the loop drained would have spun forever,
#     deaf to an enclosing `withTimeout`. One `ensureActive()` per iteration fixes
#     it, the same role `fetchAllPages` gives its per-page check.
#   The `deadOut`/`doneOut`/`onTimeout` out-parameters collapse into a returned
#     `FetchAllResult` (events + `doneReasons` + `stalled`, with `dead`,
#     `anyRelayServed` and `authRefused` derived from them). The same facts, no
#     longer smuggled back through the argument list where a caller could allocate
#     one half and read the other stale. The unused `diagnoseSlow` flag went too.
#
# None of it reaches this store, and not by luck: we ARE the store a relay reads
# from, not a client reading relays. grep finds no `fetchAll`, `INostrClient`,
# `DrainFailure` or `relay.client` reference in any module here. Nothing under
# nip01Core/store, nip50Search, nip01Core/relay/filters or nip85TrustedAssertions
# was touched at all; IEventStore, SQLiteEventStore, IndexableFields,
# SearchFieldExtractor, SearchQuery, SearchableEvent and EventFactory are
# byte-identical to the previous pin; the SearchableEvent set is the same 129 files
# and no `indexableContent()` anywhere in the module changed. So the searchable-kind
# table, the extractor weights, the store contract and the filter semantics all
# carry over unchanged, and the parity and rank gates are unaffected. No build file
# under quartz/ moved and the root version catalog is untouched, so nothing
# transitive shifts under us. The three non-quartz files (the app's Concord actions,
# two cli files) are call sites adapting to the new signature. We take it to stay on
# head, not for anything it gives this store.
#
# Prev 1ff1077d58 (2026-08-12, PR #3905: the NIP-42-aware read accessories and the
# NIP-45 `mergeCountResults` mixed-HLL case; this range is its immediate follow-up).
# This range touches no .claude/skills at all, so the five imported here are still
# current for this pin.
quartz = "1866007e99"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
