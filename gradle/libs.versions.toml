[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.1"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# 28bf170f92 = amethyst main @ 2026-09-26 (PR #4212 merged). MOVED BECAUSE THE RELAY
# ASKED: #4212 is the relay's own change (NIP-FE, relay commands over HTTP, and the
# engine seams it needs), and the relay's `force(libs.quartz)` would otherwise run
# THIS store on a quartz it was never compiled against.
#
# That is not hypothetical this time. The range is 958 commits, and one of them
# (6d2c37c346) renames 110 event classes to their NIP names with no alias left
# behind. Two of them are on this store's write and trust paths:
#   DeletionEvent    -> DeletionRequestEvent   (nip09Deletions; EventAdmission's
#                                               `instanceof` on every insert)
#   ContactCardEvent -> UserAssertionEvent     (nip85TrustedAssertions.users)
# plus three the tests and the benchmark name (LongTextNoteEvent ->
# LongFormContentEvent, PeopleListEvent -> nip51Lists.followSet.FollowSetEvent,
# FollowListEvent -> nip51Lists.starterPack.StarterPackEvent). A store jar built on
# a8e8778265 and run on this quartz dies with NoClassDefFoundError on its first
# insert, so the relay cannot move its pin until this one has.
#
# What this store reads out of the range, beyond the renames:
#
#   IEventStore, Filter, FilterMatcher, SearchQuery, IndexableFields: no changed line.
#
#   SearchFieldExtractor: renames only — every branch keeps its fields, roles and
#     weights, so every kind already stored indexes the same words on the same
#     columns. NO REINDEX for what is already searchable.
#
#   The searchable SET grows 142 -> 150 kinds (every kind 0..65535 built through
#     EventFactory, both jars; the previous note's 144 counted differently). None
#     leave. All eight fall through the `is SearchableEvent ->` catch-all, body role:
#       7516 / 37516 / 37517   NIP-CC geocache found log / listing / curation list
#       9998 / 9999            Tapestry decentralized list header / item
#       39998 / 39999          the same, addressable
#       39307                  NIP-71 video text track
#     The listing's `cacheName()` and the list headers' titles take the body-role
#     title discount the last bumps fixed for other kinds: a RANKING gap, fixed
#     upstream with one branch each. Recall is FORWARD-ONLY until
#     `reindexFullTextSearch()` runs, as last time: events of these kinds already
#     stored were ingested as plain events and carry no search fields.
#
#   SQLiteEventStore (the parity gate's reference): insert failures are classified
#     against the database instead of the driver's message, and a superseded
#     replaceable is now `duplicate:` (RejectionReason.SUPERSEDED). This store still
#     answers a superseded replaceable with `replaced:` (Rejections.REPLACED): the two
#     reference stores now DISAGREE on that reason, which the parity gate does not
#     compare (it compares what is stored and served, not rejection text).
#
#   The relay engine answers a `duplicate:` rejection with OK TRUE (NIP-01), where it
#     answered false. So a relay on this store now acknowledges an exact resend, and
#     still refuses a superseded replaceable with OK false `replaced:` — NIP-01 allows
#     either for that case; adopting SUPERSEDED is a separate, visible choice.
#
#   Quartz no longer depends on jackson-module-kotlin (jackson-databind instead),
#     which was the only thing putting kotlin-reflect on this build's classpath. Two
#     tests read members by reflection; they now declare kotlin-reflect themselves.
#
# DIRECTION: a8e8778265 is a strict ancestor of this.
#   git merge-base --is-ancestor a8e8778265 28bf170f92   # verified
#
# Prev a8e8778265 (2026-09-10: SearchableEvent's read path, 133 -> 144 kind values
# by that count, no reindex for stored kinds).
quartz = "28bf170f92"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
