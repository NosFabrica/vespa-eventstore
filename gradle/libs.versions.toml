[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.0"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# a5507f9a4d = amethyst PR #3889 (2026-08-09), 24 commits. Quartz's share is 12
# files in two areas, and this store imports from neither:
#
#   concord/ (cord04Roles, cord05Invites, cord06Rekey) — the fixes that fell out of
#     auditing Concord's soft-ban and Control Plane surface: the banlist is now
#     honoured against the Control Plane itself (a banned staffer could still sign
#     control events), compaction carries the authority-gated head rather than the
#     raw chain head, and EditionFold no longer lets a stray edition pin a Control
#     entity's version forever. Plus a perf skip of AuthorityResolver's second pass
#     when it cannot change the outcome. No new event kinds, no new files outside
#     tests.
#   nip01Core/relay/client/accessories/NostrClientFetchAllPagesExt — two
#     termination guards for a paged walk, both found on a live relay: the `until`
#     cursor floors at epoch 0 (stepping below an unsigned timestamp means DRAINED,
#     and keeps a negative `until` — which relays handle five different ways — off
#     the wire), and a page whose every event came back NEWER than the `until` it
#     asked for means the relay is ignoring the cursor, so the walk ends UNPAGEABLE
#     instead of spinning ~5.5 pages a second forever. Purely additive: no
#     signature change and no new `PagedFetchResult.End` constant, so unlike the
#     previous pin's fetchAllPages work this one is not source-breaking.
#
# Both areas are Concord group crypto and relay-client paging, neither of which
# this store is: grep finds no reference to fetchAllPages, PagedFetchResult,
# INostrClient or Concord in any module here. Nothing under nip01Core/store,
# nip50Search, nip01Core/relay/filters or nip85TrustedAssertions was touched at all;
# IEventStore, SQLiteEventStore, IndexableFields, SearchFieldExtractor and
# SearchQuery are byte-identical to the previous pin, and the SearchableEvent set is
# the same 129 files. The store contract, filter semantics and the searchable-kind
# table carry over unchanged, so the parity and rank gates are unaffected. No build
# or dependency file moved in the range either — quartz/build.gradle.kts and the
# root version catalog are untouched, so nothing transitive shifts under us. The
# rest of the range is app-side (notification grouping/dismissal, NIP-5D napplet
# host alignment, the Concord audit docs). We take it to stay on head, not for
# anything it gives this store.
#
# Prev 875531afb0 (2026-08-09, PR #3881: CORD-02 §2's staff-held control_root write
# gate plus a control-plane key split, SyncCoverage's `complete` moving per-kind
# onto Span, and fetchAllPages returning a drained outcome instead of signalling by
# callback; same relay-client and Concord plumbing, equally unused here).
# This range touched no skill files, so the .claude/skills imported at 9231195890
# are current for this pin.
quartz = "a5507f9a4d"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
