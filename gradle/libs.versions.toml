[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.0"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# c43339e92b = amethyst PR #3891 (2026-08-10), 30 commits. Quartz's share is 15
# files in two areas, and this store imports from neither:
#
#   concord/cord05Invites — the CORD-05 Invite List (kind 13303): the creator's
#     NIP-44 self-encrypted record of every link they minted (token + link-signer
#     secret), so a link can be re-signed at its addressable kind-33301 coordinate
#     after a Rekey instead of being orphaned by it. Plus the revocation tombstone
#     that retires a link (same `["d",""]` coordinate, empty content, `vsk=9`), and
#     CommunityInvite becoming a `data class`. One new kind, registered in
#     EventFactory — additive, and 13303 already fell in the replaceable range, so
#     it was already stored as replaceable here before it had a type.
#   nip01Core/relay/client/accessories — negentropy gains an optional
#     `wantId: ((HexKey) -> Boolean)?` on negentropySync / negentropySyncOrFetch /
#     negentropySyncFanOut, consulted per id BEFORE the download REQ, with a
#     `skipped` count on the three result types. Default null keeps every existing
#     call byte-identical.
#
# The negentropy gate is the one thing in this range worth knowing about even
# though the store cannot use it: its motivating measurement is a downstream
# mirror — a store that keeps only the newest version of a replaceable event, i.e.
# exactly what `insertLocked` does when it answers "replaced:" — re-downloading
# the older copies negentropy keeps re-offering, because they are genuinely absent
# from the local id set (5/18/29 REPLACED rejections over three passes on kinds
# 0/3/10002). A relay-side ingress feeding this store can now decline those ids
# before the bodies cross the wire. That is ingress's call to make; nothing here
# speaks the client protocol.
#
# Otherwise both areas are Concord group crypto and relay-client sync, neither of
# which this store is: grep finds no reference to negentropy, INostrClient or
# Concord in any module here. Nothing under nip01Core/store, nip50Search,
# nip01Core/relay/filters or nip85TrustedAssertions was touched at all; IEventStore,
# SQLiteEventStore, IndexableFields, SearchFieldExtractor and SearchQuery are
# byte-identical to the previous pin, and the SearchableEvent set is the same 129
# files (13303 is a BaseReplaceableEvent, not a SearchableEvent). The store
# contract, filter semantics and the searchable-kind table carry over unchanged, so
# the parity and rank gates are unaffected. The one build-file move is
# quartz/build.gradle.kts teaching verifyKmpPurity to reject a bare `synchronized(`
# call and not just the annotation — a lint rule for Quartz's own sources, no
# dependency change; the root version catalog is untouched, so nothing transitive
# shifts under us. The rest of the range is app-side (per-visible metadata/reaction
# loading moved to commons over five phases, relay-flow seeding fixes, Crowdin
# translations, an iOS/arm64 CI fix). We take it to stay on head, not for anything
# it gives this store.
#
# Prev a5507f9a4d (2026-08-09, PR #3889: the Concord soft-ban / Control Plane audit
# fixes plus two fetchAllPages termination guards; same relay-client and Concord
# plumbing, equally unused here).
# This range's only skill change is .claude/skills/relay-client, which is not one of
# the five imported here, so the .claude/skills imported at 9231195890 are current
# for this pin.
quartz = "c43339e92b"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
