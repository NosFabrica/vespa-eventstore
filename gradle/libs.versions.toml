[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.0"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# 7caf4a8a25 = amethyst PRs #3866/#3868/#3869/#3870/#3871 (2026-08-06). Only 15
# quartz files changed and EVERY one is NIP-77 negentropy client/serialization;
# IEventStore, SQLiteEventStore, IndexableFields and SearchFieldExtractor are
# byte-identical to the previous pin, nothing under nip01Core/store or nip50Search
# changed at all, so the store contract, filter semantics and the searchable-kind
# table are untouched and the parity and rank gates are unaffected. We reference
# none of the changed files.
#
# The reason to take this pin: #3871 lands the windowed negentropy sync this store
# was built to feed. NegentropyLocalIndex (new) lets a caller answer a sync
# window at a time — count(window) pre-splits BEFORE a round trip is spent, and
# entriesFor(window) materialises only that window — so peak memory becomes one
# window instead of the whole matching corpus. NegErrMessage (new) reads the
# relay's own cap off a size refusal, from the non-standard 4th wire element or
# from strfry's prose, so window sizing learns the number no NIP-11 field carries.
# Both map onto what this store already exposes (count / snapshotIdsForNegentropy)
# — wiring an adapter is a follow-up, not part of this bump.
#
# #3866 is a configurable left drawer, #3868 a file-header fallback, #3870 app-side
# IME padding, #3869 Crowdin — all app-side and unused here. Prev 9373c0a22c
# (2026-08-05, PRs #3860/#3862/#3863/#3864: the incoming-message chain became
# suspending — source-breaking for implementors of the relay-client interfaces,
# none of which we implement — plus per-kind SyncCoverage bands and UrlDetector
# tails). This range touched no skill files, so the .claude/skills imported at
# 9231195890 are current for this pin.
quartz = "7caf4a8a25"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
