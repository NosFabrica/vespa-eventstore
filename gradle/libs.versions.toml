[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.1"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from Maven Central (com.vitorpamplona.quartz:quartz, a release) — NIP-11 DSL + opt-out
# SQLite FTS index.
# 2.7.3 = tag v2.7.3 (fbe0912), from Central as before. 81 commits over v2.4.0 (8d6895c); scanned
# against this store's imports (32 packages; a tree diff of quartz/src between the tags, main
# sources). What reaches the store, all through SearchFieldExtractor and EventFactory:
#  - SIX MORE SEARCHABLE KINDS, drss.io's reader: 30100 (feed list: title, feed titles), 30101 (list
#    folder: title), 30102 (event list: title), 30104 (provenance folder: title), 31341 (show: name),
#    31985 (provenance: the note, and its source as the website field). Stored ones index after
#    store.reindexFullTextSearch(listOf(30100, 30101, 30102, 30104, 31341, 31985)). Kinds 30100-30104
#    and 31985 are shared with other apps: an event without drss's shape parses as an
#    UnrecognizedKindNNNNNEvent and stays unsearchable, as before.
#  - KIND 30054 IS SPLIT: only a Podcasting-2.0 episode's shape is still a Podcasting20EpisodeEvent;
#    drss.io's listening-progress records are DrssListenProgressEvent, the rest
#    UnrecognizedKind30054Event, and neither is searchable. A progress record indexed under 2.4.0
#    keeps its search fields until store.reindexFullTextSearch(listOf(30054)) re-reads it.
#  - NAPPLETS (15129 / 35129 / 5129) now also carry their source url as the website field, like
#    15128 / 35128 / 5128; stored ones gain it after store.reindexFullTextSearch(listOf(15129, 35129, 5129)).
#  - Not reached here: relay-url policy (isLocalHost covers 100.64.0.0/10, single-label hosts and
#    .lan/.home/.internal; the new isDialableFromOthers; parsers keep local relays and the filtered
#    accessors are deprecated until 3.0.0), FilterMatcher/FilterIndex live fan-out speedups,
#    LabelEvent.labeledRelayUrls normalizing through ReferenceTag, DTag.isTag. This store calls none
#    of them on its own paths.
#  - RUNTIME CLASSPATH (:store): quartz alone moves; the published POM names the same dependency
#    versions as 2.4.0's.
#
# Prev 2.4.0 = the same code as c63c35ca76 (below): the release workflow publishes tag v2.4.0, and
# git rev-parse v2.4.0^{commit} = c63c35ca7629. FROM CENTRAL, NOT JITPACK, because this store is
# itself published to Central with quartz as an `api` dependency: a JitPack coordinate in its POM
# is one a consumer without JitPack cannot resolve. With it, this build reads nothing from JitPack
# and settings.gradle.kts drops the repository. The group differs from JitPack's
# (com.github.vitorpamplona.quartz), so a graph holding both would carry two quartz modules side by
# side, not a version conflict; vespa-relay, which still takes this store from JitPack,
# substitutes the old group for this one. Runtime classpath identical to c63c35ca76's (the
# published POM names the same dependency versions).
#
# Prev c63c35ca76 = vitorpamplona/quartz v2.4.0 (main @ 2026-10-27, the merge of quartz#38), a descendant
# of dfe281430a (below): 100 commits, 67 touching quartz's main sources. Scanned against this
# store's imports (38 packages; a tree diff of quartz/src between the pins, main sources):
#  - JACKSON IS GONE (quartz d445157, BREAKING upstream): OptimizedJsonMapper is common code over
#    Kite, quartz's own reader/writer, for events, messages, commands, filters and tags; kotlinx for
#    the rest. This store parses and writes events through it (EventDoc, EventDocConversion), so
#    every event read is Kite's: the same events on valid input (vespa-relay compared the two over
#    65,050 real frames), stricter on malformed input (a non-string `content` or `pubkey` is refused).
#    relay.filters loses only its Jackson (de)serializers, which this store never called.
#  - THREE MORE SEARCHABLE KINDS, 33953 (EbookEvent), 34609 (MagazineEvent), 39731
#    (MagazineIssueEvent), new classes on the catch-all. Stored ones index after
#    store.reindexFullTextSearch(listOf(33953, 34609, 39731)); no other kind's extraction moved.
#  - Same-answer: EventFactory.create is split in four (JIT-able: parsing 11-21% faster), Hex gains
#    range helpers, RawEvent presizes its JSON and writes `\u00xx` lowercase like Kite,
#    nip01Core.store's deletion extension and ObservableEventStore are refactors this store does
#    not call. Comment reply targets and zap poll options moved; this store reads neither.
#  - RUNTIME CLASSPATH (:store): jackson-databind and mls 1.0.0 leave; jackson-core drops from
#    2.22.3 (databind's) to 2.22.0, the version the Vespa feed client declares; crypto-kmp
#    1.0.0 -> 2.1.0, okhttp 5.5.1, kotlinx-serialization 1.12.0, kotlin-stdlib 2.4.21,
#    androidx.collection 1.7.0.
#
# Prev dfe281430a = vitorpamplona/quartz @ 2026-10-21, the first pin from Quartz's own repo: it left Amethyst
# that day, so the coordinates move from com.github.vitorpamplona.amethyst:quartz to
# com.github.vitorpamplona.quartz:quartz. Over e7f23068e0 (below) it carries vitorpamplona/quartz#3, the
# outbox fix (a failed connection keeps an event pending, re-sent on the next one, and gives it up after
# two minutes unreachable: a relay restart used to drop vespa-relay's whole RelayWriter window, stalling
# its sync until a timeout), and vitorpamplona/quartz#6, whose head this is: a jitpack.yml that runs
# Gradle without JitPack's $MAVEN_CENTRAL_MIRROR, a Google mirror that lags Central by days and had no
# crypto-kmp or mls-kmp 1.0.0 (every JitPack build of Quartz failed from the crypto-kmp split on; this
# repo's jitpack.yml does the same, for the same two). Scanned against this store's imports (a tree
# diff of quartz/src between the pins, main sources): outside the client outbox (relay.client.pool,
# NostrClient), every change in a package this store imports is an import line, because the crypto
# primitives (utils/sha256, ciphers, mac, …) moved to crypto-kmp, MLS to mls-kmp and the chess engine
# to Amethyst. That includes nip01Core.crypto's hasher, nip01Core.store.sqlite and the relay server.
# Inert here: this store imports nothing from relay.client. The runtime classpath gains
# com.vitorpamplona.crypto:crypto and com.vitorpamplona.mls:mls 1.0.0 (both MIT, from Maven Central)
# and loses kchesslib, kotlinx-datetime and kotlinx-io.
#
# Prev e7f23068e0 = amethyst main @ 2026-10-21: the amethyst #4591 merge, its two commits the only ones over
# 98089642eb (below) touching quartz/, both in relay.client: NostrClient.keepConnected (a relay held
# connected between bursts), an auth-required: no responder can answer ends an event's delivery, and
# publishStream opens its window at once on an open socket. Taken for vespa-relay's sync, which
# holds its relay with keepConnected. Inert here: this store imports nothing from relay.client, and
# quartz/build.gradle.kts and amethyst's version catalog have no diff in the range.
# 98089642eb is a strict ancestor (git merge-base --is-ancestor 98089642eb e7f23068e0).
#
# Prev 98089642eb = amethyst main @ 2026-10-20: the amethyst #4589 merge (an OK, true or false, ends an
# event's delivery to that relay: the client outbox kept refused events until three refusals, so
# vespa-relay's sync, forwarding to its relay, held every event the relay refused in memory).
# 42 commits over 99d05ee122 (below) touching quartz/. Scanned per package this store imports (21):
#  - nip01Core.core: Event's id and pubKey become `var … private set`, for a new shareStrings()
#    that LocalCache calls; the getters and the constructor are unchanged.
#  - the Jackson event parser stops interning id, pubkey and tag values (#4583: interning moved to
#    where a cache keeps an event); the parsed event is equal, only less is interned.
#  - nip01Core.store: VerifyAndInsert checks for cancellation; relay.normalizer interns each relay
#    url once and normalizes idempotently; relay.client is the #4589 outbox change.
#  - utils: in-house SHA-2/HMAC/AES for the native targets; JVM event ids still hash through
#    MessageDigest. kotlinx-crypto-hmac/-sha2 leave commonMain's dependencies.
# Inert here: nip50Search (SearchFieldExtractor), relay.filters, tags, the NIP-09/40/51/62/85 kinds
# and every SearchableEvent have no diff in the range: no kind extracts differently, no reindex.
# 99d05ee122 is a strict ancestor (git merge-base --is-ancestor 99d05ee122 98089642eb).
#
# Prev 99d05ee122 = amethyst main @ 2026-10-17: the amethyst #4522 merge. 38 commits over e5bdf1bd37
# (below), 12 of them touching quartz/, every one in the relay client and its OkHttp socket:
#  - #4517: a paged walk loses no event when its relay hangs up mid-page;
#  - #4521: a fresh connection replays its subscriptions before anything else goes out (the NIP-46
#    reply race), a socket delivers what the relay sent before closing, and the apps share
#    BasicOkHttpWebSocket;
#  - #4522: availableRelaysFlow emits, a tagsAll-only change is re-sent, an exception from a paged
#    walk's onEvent reaches the caller, fetchAsFlow/subscribeAsFlow stop copying per event,
#    RelayStat counters are atomic.
# Inert here: this store imports nothing from relay.client or relay.sockets, and nip01Core.store,
# nip01Core.core, relay.filters, nip50Search (SearchFieldExtractor), the Jackson deserializers,
# quartz/build.gradle.kts and amethyst's version catalog have no diff in the range: no kind
# extracts differently, no reindex, the same transitive dependencies. Taken for vespa-relay,
# which forces this store's Quartz and runs that relay client.
# e5bdf1bd37 is a strict ancestor (git merge-base --is-ancestor e5bdf1bd37 99d05ee122).
#
# Prev e5bdf1bd37 (on this branch only, never on main) = the amethyst #4515 merge (the client pool keeps a relay
# under an in-flight EVENT; a dropped relay is redialed when its backoff ends). 38 commits over
# 020e714858 (below), 18 of them touching quartz/. Scanned per package this store
# imports: what it calls moves in one place, derived data:
#  - SearchFieldExtractor. 3 kinds become searchable, the OpenAgents ones: 30184 extension
#    listings (title + slug, description), 3184 extension releases (package slug, version) and
#    30180 capability discovery (`package/component` path + operation ids, summary, interface id).
#    JSON bodies, parsed; their `t` tags are protocol markers (`oa:ext:listing:v1`, `oa:cap:v1`),
#    so they take no hashtag role. EventFactory builds the three classes. None leaves the set and
#    no kind already searchable extracts differently.
# Rolled out with no resync by the kind-scoped walk: store.reindexFullTextSearch(listOf(3184, 30180, 30184))
# Inert here: nip01Core.store, relay.filters, tags and Hex have no diff in the range; the client
# pool, SeenIds and GZip changes are code this store does not call.
# ce7f4db1b6 is a strict ancestor (git merge-base --is-ancestor ce7f4db1b6 e5bdf1bd37).
# Spelled with 10 hex digits like the pin it replaces.
#
# Prev 020e714858 (on this branch only, never on main): the amethyst #4510 merge, six quartz
# commits in relay client / server packages this store does not import.
#
# Prev ce7f4db1b6 = amethyst main @ 2026-10-16: the amethyst #4506 merge (Open Markets collections,
# shipping options and product reviews). 839 commits over 68268da413, 154 of them touching quartz/;
# 68268da413 is a strict ancestor (git merge-base --is-ancestor, on a full-depth clone).
# Scanned per package this store imports (21): what this store calls moves in two places, all
# derived data:
#  - SearchFieldExtractor. 12 kinds become searchable: Open Markets 30405 product collections
#    (title, summary, content) and 30406 shipping options (title, carrier, content), 31555
#    product reviews (catch-all), 30024 long-form drafts (as 30023), 1624 git cover notes
#    (catch-all), 5128 website snapshots (as 15128), 30031 sticker packs (title, description +
#    shortcodes; never content), 30301/30302 Kanban boards/cards and 30301 build verifications,
#    33402 workout templates, 36767 profile themes, 38385 Mostro instance info. 30301, 30302,
#    30405, 30406 and 38385 are tag-split in EventFactory like 38000: the other apps on those
#    numbers (Shopstr's encrypted carts and escrow records, a planner app, Fieldbook, Paygress)
#    parse as UnrecognizedKind*Event, addressable and never indexed. None leaves the set.
#  - NIP-15 bodies (30017/30018/30019/30020, 1022) are read leniently: a missing `id`, a price
#    or quantity as a string, an auction in tag form no longer fail the decode, so events that
#    indexed nothing at 68268da413 now index their name and description.
# Rolled out with no resync by the kind-scoped walk over exactly these 17 kinds:
#   store.reindexFullTextSearch(listOf(1022, 1624, 5128, 30017, 30018, 30019, 30020, 30024,
#   30031, 30301, 30302, 30405, 30406, 31555, 33402, 36767, 38385))
# Inert here: nip01Core.store, relay.filters and tags have no diff in the range. Additive or
# same-answer: EventFactory.isKnownKind gains a per-kind cache; address validation calls
# Hex.isHex(value, start, end) (the same hex set); ServiceType gains 30382:hops, :reporters
# and :muters (the lens reads rank and followers only); trusted lists gain description() and
# rigor(); AssertionMetric is new. EmojiUrlTag's `:code:url` reader now refuses a blank part;
# this store reads `emoji` TAGS, not that string form.
#
# Prev 68268da413 (2026-10-06: the hint-provider / NIP-50 / tag-relationship series; 42 kinds
# newly searchable and 19 extracting differently, repaired by a kind-scoped walk over 61 kinds;
# EventFactory builds 31890 and 10044; tag relay slots parse strictly, inert here).
# Prev d792ebc4bf (2026-10-05: amethyst #4325; kind 38000 split by tags, decentralized lists'
# text tier, NIP-62 relay compared normalized, 30394 member `a` coordinate-shaped; repaired by
# reindexFullTextSearch(listOf(38000, 30267, 9998, 9999, 39998, 39999))).
# Prev fcd76d2075 (2026-09-27: amethyst #4231, NIP-FE's published form, RelaySession,
# NIP-49; nothing this store called moved, pinned for vespa-relay).
# Prev a53cafd577 (2026-09-27: amethyst #4214, NIP-FE's review fixes; nothing this store called
# moved, pinned for the relay the same way).
# Prev ec16988e3a (2026-09-27: amethyst #4222 returned Quartz's SQLite store to REPLACED,
# `replaced:` / OK false, for a stale replaceable, which this store never left; #4215 before it
# (1cfb6e922f) gave decentralized lists, text tracks and release notes their own extractor
# branches, derived data a corpus picks up with reindexFullTextSearch()).
# Prev 28bf170f92 (2026-09-26: event classes renamed to their NIP names; Quartz's SQLite
# store answered a stale replaceable with SUPERSEDED, `duplicate:` / OK true, which this store
# did not follow and ec16988e3a reverted upstream; 142 -> 150 reachable
# searchable kinds, eight new classes on the catch-all; jackson-module-kotlin and kotlin-reflect leave
# the classpath).
# Prev a8e8778265 (2026-09-10: 133 -> 144 searchable kind values, all eleven on the
# catch-all; SearchableEvent grows the read-path forEachIndexableField, no reindex).
# Prev cecc3287b2 (2026-09-01: 17 catch-all kinds split into title/body roles, four
# affiliation URLs, six doubled `t`-tag scans dropped; a ranking backfill).
quartz = "2.7.3"
coroutines = "1.11.0"
serialization = "1.11.0"
# Matches what Quartz brings transitively; Gradle would resolve to it regardless.
sqlite = "2.7.1"
# Likewise Quartz's own okhttp line (it already was, at the previous pin).
okhttp = "5.5.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# The container API the :bundle request handler compiles against (compile-only: Vespa provides it
# at runtime). Only stable public API is used, so the bundle runs on any Vespa 8 container.
vespa-container = "8.763.13"
# Lucene's analysis module, for its Portuguese and Spanish LIGHT stemmers (Savoy's,
# the ones Lucene's own analyzers use) — engine/text/StemText. Apache-2.0 (checked
# against the published POM); pulls in lucene-core.
lucene = "9.12.2"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.vitorpamplona.quartz:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
lucene-analysis-common = { module = "org.apache.lucene:lucene-analysis-common", version.ref = "lucene" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
vespa-container-dev = { module = "com.yahoo.vespa:container-dev", version.ref = "vespa-container" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
