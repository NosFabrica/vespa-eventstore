[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.1"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# 53a7127524 = amethyst main @ 2026-10-08 (#4371). Not the tip, af7b1772cd: it and 439cbcc23f
# (#4375, the same Quartz as the tip) fail on JitPack with the GradleWrapperMain error the
# 68268da413 note blamed on Crowdin syncs. That was wrong: 53a7127524 sits after several Crowdin merges and builds, the wrapper
# jar and gradlew are byte-identical across all three, and every failure reproduced on a fresh
# JitPack ref. What 53a7127524 lacks of the tip's Quartz is the consumer WoT index
# (nip85TrustedAssertions/users/index, TrustNetwork*) and three ProviderTypes constants (hops,
# reporters, muters); this store reads ProviderTypes.rank / followerCount only.
# What this store calls moves in one place:
#  - SearchFieldExtractor + EventFactory. 9 kinds become searchable, each a new typed class:
#    git cover notes (1624, content), site snapshots (5128, title / description / source URL),
#    long-form drafts (30024, as 30023), sticker packs (30031, title / description + shortcodes,
#    never content), Kanban boards and cards (30301 / 30302, title / description), WalletScrutiny
#    build verifications (30301 with `i` + `status`: description / report from the JSON content),
#    workout templates (33402, title / content), profile themes (36767, title / description) and
#    Mostro instance info (38385 with `z`=info or `mostro_version`: instance name / fiat
#    currencies). 30301, 30302 and 38385 are shared numbers: Quartz picks the class by tags and
#    parses the other apps' shapes as Unrecognized* classes, never indexed. 23 more kinds get a
#    typed class and stay unsearchable (443, 1080, 4454/4455, 8383, 9401, 9840-9844, 13473, 16767,
#    18678, 19843/19844, 29846, 30509, 31986, 38384, 38386, 39842, 39844). Nothing already
#    searchable extracts differently and nothing leaves the set: a sweep of every kind 0..65535
#    through EventFactory + SearchExtractors, three tag shapes each, under both pins.
# Derived data only, rolled out with no resync by the kind-scoped walk over those 9 kinds:
#   store.reindexFullTextSearch(listOf(1624, 5128, 30024, 30031, 30301, 30302, 33402, 36767, 38385))
# Inert here: AddressSerializer's hex check now calls Hex.isHex(start, end) (same table, both
# cases), and the client-side paging / negentropy / OkHttp socket fixes this store never calls.
#
# Prev 68268da413 (2026-10-06: the hint-provider / NIP-50 / tag-relationship series; 42 kinds
# became searchable and 19 extracted differently -- chat subject, picture alt, video chapters,
# citations and learning resources tiered, prediction markets, file-storage captions, highlight
# context, legacy bookmark-list name, persona description, story options, Podcasting 2.0 people,
# emoji packs dropping their NIP-44 ciphertext; EventFactory built 31890 and 10044; repaired by a
# reindexFullTextSearch over 61 kinds, listed in commit 987a0cc).
# Prev d792ebc4bf (2026-10-05: amethyst #4325; kind 38000 split by tags, decentralized lists'
# text tier, NIP-62 relay compared normalized, 30394 member `a` coordinate-shaped; repaired by
# reindexFullTextSearch(listOf(38000, 30267, 9998, 9999, 39998, 39999))).
# Prev fcd76d2075 (2026-09-27: amethyst #4231, NIP-FE's published form, RelaySession,
# NIP-49; nothing this store called moved, pinned for vespa-relay).
# Prev a53cafd577 (2026-09-27: amethyst #4214, NIP-FE's review fixes; nothing this store called
# moved, pinned for the relay the same way).
# Prev ec16988e3a (2026-09-27: amethyst #4222 returned Quartz's SQLite store to REPLACED,
# `replaced:` / OK false, for a stale replaceable, which this store never left; #4215 before it
# (1cfb6e922f) gave decentralized lists, text tracks and release notes their own extractor
# branches, derived data a corpus picks up with reindexFullTextSearch()).
# Prev 28bf170f92 (2026-09-26: event classes renamed to their NIP names; Quartz's SQLite
# store answered a stale replaceable with SUPERSEDED, `duplicate:` / OK true, which this store
# did not follow and ec16988e3a reverted upstream; 142 -> 150 reachable
# searchable kinds, eight new classes on the catch-all; jackson-module-kotlin and kotlin-reflect leave
# the classpath).
# Prev a8e8778265 (2026-09-10: 133 -> 144 searchable kind values, all eleven on the
# catch-all; SearchableEvent grows the read-path forEachIndexableField, no reindex).
# Prev cecc3287b2 (2026-09-01: 17 catch-all kinds split into title/body roles, four
# affiliation URLs, six doubled `t`-tag scans dropped; a ranking backfill).
quartz = "53a7127524"
coroutines = "1.11.0"
serialization = "1.11.0"
# Matches what Quartz brings transitively; Gradle would resolve to it regardless.
sqlite = "2.7.1"
# Likewise Quartz's own okhttp line (it already was, at the previous pin).
okhttp = "5.5.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
