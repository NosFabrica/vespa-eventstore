[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.0"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# f4640b6ea1 = amethyst PR #3877 (2026-08-08). Quartz's share of the range is TWO
# files, both in nip01Core/relay/client/accessories: SyncCoverage and its test.
# SyncCoverage keyed its per-(relay, filter) bands by "$url $filterJson"; the key
# is now a typed BandKey(relay, filter) pair, with encode()/decode() kept on the
# class for a file layer that still wants one joined key per line. Two reasons
# given: a persistence layer had to re-split the key on a separator it could only
# learn by reading the class, and the joined form COPIED the filter's json (tens
# of thousands of chars for an author-scoped filter) plus rehashed all of it on
# every lookup, once per relay per cycle. export()/restore() move with it, so this
# range IS source-breaking — but only for callers of SyncCoverage, of which the
# only one in the range is geode's SyncCoverageFile, updated in the same PR.
#
# That is the relay client's sync bookkeeping, which this store is not: grep finds
# no reference to SyncCoverage, BandKey, or anything under relay/client in any
# module here. IEventStore, SQLiteEventStore, IndexableFields and
# SearchFieldExtractor are byte-identical to the previous pin; nothing under
# nip01Core/store or nip50Search was touched at all. The store contract, filter
# semantics and the searchable-kind table carry over unchanged, and the parity and
# rank gates are unaffected. The rest of the range is app-side (a bare-subtype
# imeta mime repair in commons/RichTextParser, a drawer-count plural, Crowdin
# translations). We take it to stay on head, not for anything it gives this store.
#
# Prev 35f96a936d (2026-08-06, PR #3872: PoolEventOutbox stopped rebuilding an
# immutable map per send — N publishes had copied 1+2+…+N — now a LargeCache with
# the relay set swept every 256; relay-client-internal, nothing this store calls).
# This range touched no skill files, so the .claude/skills imported at 9231195890
# are current for this pin.
quartz = "f4640b6ea1"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
