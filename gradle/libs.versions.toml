[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.0"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# 1ff1077d58 = amethyst PR #3905 (2026-08-12), 80 commits. Quartz's share is 32
# files in three areas, and this store imports from none of them:
#
#   nip01Core/relay/client{,/auth,/accessories} (19 files) — the read accessories
#     learn NIP-42. A relay that gates reads answers the REQ with
#     `CLOSED auth-required:` BEFORE it sends anything, and treating that as
#     terminal returned "empty" while the client's own responder was still signing
#     the challenge on the same socket (measured: fetchAll gave up in 18ms against
#     a relay holding five matching events). Every read accessory now takes
#     `pendingOnAuthRequired`, defaulting to `hasAuthResponder()`, and waits on the
#     new `awaitAuthOutcome` — a short grace for a responder to pick the challenge
#     up, then a settle wait bounded by the caller's own idle window, so an
#     auth-gated relay costs at most what a silent one already cost. An unsatisfied
#     wall becomes visible instead of indistinguishable from emptiness:
#     `auth-refused:<msg>`, `PagedFetchResult.End.AUTH_REQUIRED`, and a second
#     `DrainFailure` case, `AUTH_REQUIRED`, whose new `dropFromRouting` flag is
#     false — a NIP-42 wall is a property of this connection's identity, not of the
#     relay, so it must not be pruned the way a DEAD one is.
#   nip45Count (2 files) — `mergeCountResults` moves into quartz beside the
#     HyperLogLog code, and gains the mixed case: when any relay ships `hll`
#     registers, relays that answered with a plain count are no longer dropped.
#     Both are lower bounds on the union, so the answer is the larger of the two
#     (summing is never an option — relays mirror each other).
#   nip56Reports + three kinds (10 files) — ReportEvent gets a tag layout and,
#     along with ChatMessageEvent (14), ChannelCreateEvent (40) and
#     ClassifiedsEvent (30402), declares the `PubKey`/`Event`/`AddressHintProvider`
#     interfaces so a graph walker can follow their pointers. Additive methods on
#     existing types; the hint interfaces themselves are unchanged.
#
# The NIP-45 merge is the one thing in this range worth a second look from here,
# since this store answers COUNT: it is the CLIENT half of the same protocol, and
# it says what a fan-out does with what we return. We return an exact Int —
# `count()` never marks a result approximate and never emits registers — so a relay
# serving this store lands in the plain-count branch: a lower bound the merge takes
# the max over, and, as of this change, one that survives a peer shipping HLL
# instead of being discarded for a ~50 estimate. Nothing to do on our side; it is
# the reason the exact count is worth keeping exact.
#
# Otherwise all three areas are relay-client protocol and app-side event typing,
# neither of which this store is: grep finds no reference to nip45, nip56,
# HintProvider, INostrClient or RelayAuth in any module here. Nothing under
# nip01Core/store, nip50Search, nip01Core/relay/filters or nip85TrustedAssertions
# was touched at all; IEventStore, SQLiteEventStore, IndexableFields,
# SearchFieldExtractor, SearchQuery and SearchableEvent are byte-identical to the
# previous pin, and the SearchableEvent set is the same 129 files. Of those 129 the
# three that changed only gained hint methods — no `indexableContent()` anywhere in
# the module was touched — so the searchable-kind table and the extractor weights
# carry over unchanged, as do the store contract and filter semantics; the parity
# and rank gates are unaffected. No new kinds and no EventFactory change. The one
# non-KMP file, OkHttpBitcoinExplorer, swaps `execute()` for `executeAsync()`, and
# no build file under quartz/ moved: the root version catalog is untouched, so
# nothing transitive shifts under us. The rest of the range is app-side (the relay
# AUTH permission screens, the poll results page, the composer's audience flap,
# embedded-WebView focus fixes, Crowdin translations). We take it to stay on head,
# not for anything it gives this store.
#
# Prev c43339e92b (2026-08-10, PR #3891: the CORD-05 Invite List (kind 13303) and
# negentropy's optional per-id `wantId` gate; equally unused here).
# This range touches no .claude/skills at all, so the five imported here are still
# current for this pin.
quartz = "1ff1077d58"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
