[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.0"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# 98f09f29c0 = amethyst main @ 2026-08-25 (PR #3983). ONE quartz commit since the
# last pin, f5f8f605e, and it closes the gap the previous bump's test flagged:
# the Trusted List family (30392-30395) shipped with a `title` tag and no
# `SearchableEvent`, so a list published as "Podcaster" could only be reached by
# already knowing its address. `TrustedListEvent` now implements the interface on
# the base class — all four kinds inherit it — with
#
#     override fun indexableContent() = title() ?: ""
#
# The title alone. `metric` names a computation and `d` identifies the list, so
# both stay out (a search for a common word must not return every list that ran
# the same job); the member tags are hex ids and `content` is a JSON echo of the
# same membership, which `#p`/`#e`/`#a`/`#i` recall already serves far better than
# a full-text index would. A titleless list indexes "" rather than throwing —
# `indexableContent()` runs inside the store's insert transaction.
#
# What that means HERE. `SearchExtractors` mirrors the searchable set rather than
# deciding it, so this bump alone makes the four kinds searchable — no store code
# changes, and `TrustedListIndexingTest` flips from pinning the absence to pinning
# the title. Two consequences worth knowing:
#
#   TIER. Upstream gave the family no explicit `SearchFieldExtractor` branch, so it
#     takes the generic `is SearchableEvent ->` fallback: `tiers(event, null, null,
#     indexableContent())` — the whole string in the TERTIARY tier. In this
#     schema that is `search_text`, the BODY column, not `search_primary`. So a
#     list title is weighted like note content and reached by trigram substring
#     rather than the prefix/typo attributes every other titled kind enjoys
#     ("podcast" finds "Podcaster", a typo does not). Correct as a mirror, and the
#     test pins it as observed; the fix, if wanted, is one branch upstream
#     (`is TrustedListEvent -> tiers(event, event.title(), null, null)`), never a
#     local divergence — which tier an accessor lands in is Quartz's call.
#   REINDEX. Derived data: 30392-30395 already stored carry no search text until
#     `reindexFullTextSearch()` runs. New writes are indexed immediately.
#
# Nothing else moved. The range's only other files are app/desktop/CLI work no
# module here imports; under quartz/ exactly two main files changed, both in
# `experimental/trustedLists/` (the base class above and the package README), so
# IEventStore, SQLiteEventStore, IndexableFields, SearchFieldExtractor,
# SearchQuery, SearchableEvent, EventFactory and the filter semantics are
# byte-identical to the previous pin. The searchable set grows by exactly these
# four kinds: 126 classes / 129 kind values -> 130 / 133.
#
# Prev 509075abde (2026-08-20: the family itself — see PR #84 for the indexing
# audit that found this gap). Of the five .claude/skills imported from upstream,
# this range touches two, and both are refreshed in the same commit as this bump:
# searchable-events' `references/searchable-kinds.md` gains the four rows (the
# table external search engines mirror), and quartz-integration's published-artifact
# version moves 1.13.1 -> 1.14.0 (irrelevant here — we pin by commit).
quartz = "98f09f29c0"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
