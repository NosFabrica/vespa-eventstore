[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.1"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# 68268da413 = amethyst main @ 2026-10-06: the hint-provider / NIP-50 / tag-relationship series
# (amethyst 9c34a3bc..d0cbdaf0) plus its review follow-ups (68268da4). Not the tip, 3e8137ab4e: every
# commit carrying that day's Crowdin syncs fails on JitPack ("Could not find or load main class
# org.gradle.wrapper.GradleWrapperMain", the wrapper unchanged), and what 68268da4 lacks of the tip is
# Quartz refactors this store does not call (native clock, Linux sha256Into, Hex.isHex(start, end)).
# What this store calls moves in three places:
#  - SearchFieldExtractor. 42 kinds become searchable: deletion reasons (5), NIP-17 file
#    headers (15), channel hide/mute reasons (43/44), vanish reasons (62), chess (64/30066/30068),
#    NIP-29 group create/roles (9007/39003), join/leave requests (9021/9022), badge sets (30008),
#    feed definitions (31890), ContextVM servers (11316), cyberspace objects (11333/33331), relay
#    roles (33534), bid confirmations (1022), DVM OP_RETURN jobs (5901), and the Buzz kinds (8002/
#    8003/9035/9036, 30178, 30621, 40003/40006/40007/40008/40099, 40901, 42000, 43001-43006,
#    45010, 46030/46031). 19 kinds extract differently: 14 subject -> primary; 20 imeta
#    alt -> secondary; 21/22/34235/34236 chapter titles -> secondary; 31/32/33 and 30142 leave the
#    catch-all for title / summary roles (+ author, publisher, editor, journal, model; name,
#    description); 38000 prediction markets get a branch; 1065 indexes its caption; 9802 falls back
#    to the quote's prefix/suffix when there is no `context`; 10003 reads a legacy `name`; 30030
#    emoji packs stop indexing `content` -- the NIP-44 ciphertext of their private emojis -- for
#    their public shortcodes; 30054 person names + soundbite titles; 30175 persona description;
#    30296/30297 option labels. None leaves the searchable set.
#  - EventFactory builds 31890 (FeedDefinitionEvent, searchable; was a plain Event) and 10044
#    (EncryptionKeyListEvent; replaceable either way).
#  - RequestToVanishEvent is a SearchableEvent (its reason); shouldVanishFrom is unchanged.
# All derived data, rolled out with no resync by the kind-scoped walk over exactly these
# 61 kinds (the emoji-pack ciphertext already indexed stays until 30030 is walked):
#   store.reindexFullTextSearch(listOf(5, 14, 15, 20, 21, 22, 31, 32, 33, 43, 44, 62, 64, 1022,
#   1065, 5901, 8002, 8003, 9007, 9021, 9022, 9035, 9036, 9802, 10003, 11316, 11333, 30008,
#   30030, 30054, 30066, 30068, 30142, 30175, 30178, 30296, 30297, 30621, 31890, 33331, 33534,
#   34235, 34236, 38000, 39003, 40003, 40006, 40007, 40008, 40099, 40901, 42000, 43001, 43002,
#   43003, 43004, 43005, 43006, 45010, 46030, 46031))
# Inert here: tag relay slots now parse strictly (ws/wss only; normalizeOrNull stays lenient)
# and the linked*() / *Hints() providers and named relationship accessors moved -- this store
# reads provider PUBKEYS only (serviceProviders(), trustedListProvider()) and search expansion
# reads ATag.parseAddressId, both unchanged.
#
# Prev d792ebc4bf (2026-10-05: amethyst #4325; kind 38000 split by tags, decentralized lists'
# text tier, NIP-62 relay compared normalized, 30394 member `a` coordinate-shaped; repaired by
# reindexFullTextSearch(listOf(38000, 30267, 9998, 9999, 39998, 39999))).
# Prev fcd76d2075 (2026-09-27: amethyst #4231, NIP-FE's published form, RelaySession,
# NIP-49; nothing this store called moved, pinned for vespa-relay).
# Prev a53cafd577 (2026-09-27: amethyst #4214, NIP-FE's review fixes; nothing this store called
# moved, pinned for the relay the same way).
# Prev ec16988e3a (2026-09-27: amethyst #4222 returned Quartz's SQLite store to REPLACED,
# `replaced:` / OK false, for a stale replaceable, which this store never left; #4215 before it
# (1cfb6e922f) gave decentralized lists, text tracks and release notes their own extractor
# branches, derived data a corpus picks up with reindexFullTextSearch()).
# Prev 28bf170f92 (2026-09-26: event classes renamed to their NIP names; Quartz's SQLite
# store answered a stale replaceable with SUPERSEDED, `duplicate:` / OK true, which this store
# did not follow and ec16988e3a reverted upstream; 142 -> 150 reachable
# searchable kinds, eight new classes on the catch-all; jackson-module-kotlin and kotlin-reflect leave
# the classpath).
# Prev a8e8778265 (2026-09-10: 133 -> 144 searchable kind values, all eleven on the
# catch-all; SearchableEvent grows the read-path forEachIndexableField, no reindex).
# Prev cecc3287b2 (2026-09-01: 17 catch-all kinds split into title/body roles, four
# affiliation URLs, six doubled `t`-tag scans dropped; a ranking backfill).
quartz = "68268da413"
coroutines = "1.11.0"
serialization = "1.11.0"
# Matches what Quartz brings transitively; Gradle would resolve to it regardless.
sqlite = "2.7.1"
# Likewise Quartz's own okhttp line (it already was, at the previous pin).
okhttp = "5.5.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
