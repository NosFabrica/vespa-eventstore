[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.0"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# b10be95a6e = amethyst main @ 2026-08-30 (PR #4020). Bumped FOR this store: it
# carries the SearchFieldExtractor branches that fix where a Trusted List title and
# a contact card petname land — see the reindex note below, which is the one thing
# this bump requires an operator to do.
#
# The range is 35 commits and 118 files, but only TWO of them are quartz sources.
# IEventStore, SQLiteEventStore, Filter, EventFactory, IndexableFields,
# SearchableEvent and SearchQuery are byte-identical to the previous pin, so filter
# semantics are unchanged and the searchable SET does not move: still 130 classes /
# 133 kind values. What moves is the DECOMPOSITION of two families already in it.
#
#   SearchFieldExtractor (nip50Search) gained an `is TrustedListEvent ->` branch and
#     an `is ContactCardEvent ->` branch — the change this store asked for. Both
#     kinds previously fell through the generic `is SearchableEvent ->` fallback,
#     which puts the whole indexableContent() in the TERTIARY tier:
#       30392-30395: title() now fills `primary` instead of `text`. A list titled
#         "Verified Human" was scoring the phrase on the 550 affiliation rung
#         instead of the 130 000 title rung — a 236x discount that put it level
#         with a bio that merely mentions the words — and reached the title only
#         through trigram substring, never the prefix/typo columns. Measured on
#         search-staging; see benchmark/rank_cases.json "Verified Human".
#       30382: petName() fills `primary`, summary() fills `secondary`. A provider's
#         petname is that provider's NAME for a person, which is what a people
#         search is looking for. topics() is now carried ONCE, in the hashtag role
#         the tiers() funnel already filled — the fallback had been indexing it
#         twice, inside the concatenated body AND as hashtags. SearchExtractors
#         folds hashtags into the secondary tier, so for THIS store a card's topics
#         move body -> secondary; no word leaves the index.
#
# REINDEX REQUIRED, and it is the only pin bump here that has needed one: the
# extraction is derived data, so existing 30382s and 3039xs keep the old tiering
# until `reindexFullTextSearch` re-derives them. Recall is unaffected either way —
# the same words are indexed, on different columns — so this is a RANKING backfill,
# not an outage, and it can run whenever.
#
# New upstream and unused here: `nip01Core/core/ReplaceableSupersession.kt`, whose
# `Event.supersedes(existing)` is exactly the NIP-01 rule insertLocked, EventDoc's
# NEWEST_FIRST and BulkRecordInsert each spell for themselves (highest created_at,
# ties to the lexically smallest id). It has no consumer upstream yet either.
# Adopting it would delete three copies of one comparison and is worth doing — as
# its own change, not smuggled into a pin bump. The other 33 commits are app / CLI /
# desktop / translations / ime-test tooling; no module here imports any of it.
#
# Prev 029c40ebb4 (2026-08-28: ServiceProviderTag bounded to 30382..30385, member
# scores clamped to 0..100, fastMapNotNullDense — all no-ops for this store).
quartz = "b10be95a6e"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
