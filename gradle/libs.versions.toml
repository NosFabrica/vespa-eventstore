[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.0"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# 029c40ebb4 = amethyst main @ 2026-08-28 (PR #4006). A no-op bump for this store's
# behavior: IEventStore, SQLiteEventStore, Filter, EventFactory, IndexableFields,
# SearchFieldExtractor, SearchableEvent and SearchQuery are byte-identical to the
# previous pin, so filter semantics are unchanged, the searchable set stays at 126
# classes / 129 kind values plus the four Trusted List kinds (130 / 133), and
# nothing needs reindexing.
#
# The range touches 27 Kotlin files under quartz/src/commonMain. Three sit on
# surfaces this module calls, and all three land where we already were:
#
#   ServiceProviderTag (nip85TrustedAssertions) now BOUNDS what a 10040 entry may
#     delegate to NIP-85's own kinds: `parse` returns null — and the constructor
#     throws — for a `<kind>:<metric>` entry outside 30382..30385. A Treasure Map is
#     an open tag set, and Tapestry's Trusted Lists hang `3039x:<name>` entries off
#     the same event; unbounded, those parsed as NIP-85 providers and were handed to
#     code looking for a rank service. `ProviderMap` is unmoved either way: it reads
#     `serviceProviders()` and then matches only `ProviderTypes.rank` /
#     `followerCount`, both 30382, so a `3039x` entry was already dropped by that
#     `when` and is now dropped one step earlier. We never construct the tag, so the
#     new `require` cannot fire here.
#   MemberTagFields.score (experimental/trustedLists) is now a 0..100 percentage:
#     out-of-range reads back as null rather than clamped (a 950 read as 100 would
#     rank that member above every honestly-scored peer), and the builders clamp on
#     write. We index a Trusted List's `title()` and nothing else — member scores
#     never reach a document — so no stored or ranked value moves.
#   TrustedListEvent.memberValues() and the three `linked*()` accessors swapped
#     `mapNotNull` for the new `TagArray.fastMapNotNullDense` (destination presized
#     for scans where most tags match — a 5k-member list stops paying ~20 array
#     copies). Same results; our extraction path calls none of them.
#
# New upstream and unused here: `experimental/trustedLists/treasureMap`, which parses
# the `["30392", <pubkey>, <relay>]` bare-kind entry the NIP-85 parser above now
# refuses (one entry delegates every list of that kind, so the Map stays fixed-size);
# a `DeletionIndex.hasBeenDeleted(Address, pubKey)` overload for addressables whose
# event is not loaded; and BUD-11 base64url Blossom auth tokens. The rest of the
# range is app / CLI / desktop / translations / logging hygiene and nip47 NWC — no
# module here imports any of it.
#
# Prev 98f09f29c0 (2026-08-25: Trusted List titles became searchable — see PR #84).
# Of the five .claude/skills imported from upstream, this range touches none: its
# only skill edit is find-non-lambda-logs, which we do not carry.
quartz = "029c40ebb4"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
