[versions]
kotlin = "2.4.0"
# The library version published to Maven Central (com.nosfabrica.vespa.eventstore:*).
app = "1.0.0"
# vanniktech's Maven Publish plugin — the same one Quartz ships to Central with.
mavenPublish = "0.37.0"
# Quartz from JitPack (amethyst @ commit) — NIP-11 DSL + opt-out SQLite FTS index.
# 509075abde = amethyst main @ 2026-08-20, 41 commits since the last pin. We take it
# for ONE thing: the Tapestry Trusted List family, kinds 30392-30395
# (`experimental/trustedLists/`, new in c0f812e46 + its follow-up 509075abde).
#
# A Trusted List is the bulk form of a NIP-85 Trusted Assertion. Where a 30382
# card states a computed result about ONE subject, a list enumerates MANY members
# of one type, and the family binds to NIP-85's subject-type convention by a `+10`
# rule — a list kind is its assertion kind plus ten, so the last digit denotes the
# member type on both sides:
#
#   30392 = 30382 + 10 -> pubkey members, in `p` tags
#   30393 = 30383 + 10 -> event members, in `e` tags
#   30394 = 30384 + 10 -> addressable members, in `a` tags
#   30395 = 30385 + 10 -> external-id members (NIP-73), in `i` tags
#
# All four are addressable (the `d` tag names the LIST, not a subject, so a list
# replaces in place as it is recomputed) and all four are designed around
# relay-side `#p`/`#e`/`#a`/`#i` recall of the membership — which is exactly what
# this store's `tag_index` serves. `TrustedListIndexingTest` pins that.
#
# What the range does to this store: nothing but the four kinds. Nothing under
# nip01Core/store, nip50Search, nip01Core/relay/filters or nip85TrustedAssertions
# was touched at all; IEventStore, SQLiteEventStore, IndexableFields,
# SearchFieldExtractor, SearchQuery and SearchableEvent are byte-identical to the
# previous pin, the SearchableEvent set is the same 129 files, and no
# `indexableContent()` anywhere in the module changed — so the searchable-kind
# table, the extractor weights, the store contract and the filter semantics all
# carry over unchanged, and the parity and rank gates are unaffected. EventFactory
# is the one file we consume that moved, and it is PURELY ADDITIVE: four `KIND ->`
# branches and their imports, no existing branch reordered or removed.
#
# Trusted Lists are deliberately NOT `SearchableEvent` upstream, so they stay
# invisible to NIP-50 here too — `SearchExtractors` mirrors that set and must keep
# mirroring it. Before the bump they were already stored correctly (every write
# rule this store applies to them keys off the kind RANGE, never off a Quartz
# class), so the bump buys typed reconstruction on the read path — `toEvent()` now
# hands callers a `UserTrustedListEvent` instead of a base `Event` — and the typed
# builders the new tests are written against. It changes nothing on the wire.
#
# The other 39 commits are app-side and relay-CLIENT work in packages no module
# here imports (relay/client + its pool, nip19Bech32 and nip10Notes content
# scanners, nip13Pow miner, buzz invites, nip22/nip57/nip72/nip94 accessories).
# We ARE the store a relay reads from, not a client reading relays: grep still
# finds no `INostrClient`, `fetchAll` or `relay.client` reference in any module
# here. No build file under quartz/ moved and the root version catalog is
# untouched, so nothing transitive shifts under us.
#
# Prev 1866007e99 (2026-08-12, PR #3908: the `FetchAllResult` collapse of the
# NIP-42-aware read accessories' out-parameters — also client-side, also inert
# here). Of the five .claude/skills imported from upstream, this range touches
# none (only find-missing-translations moved, which we do not carry), so all five
# are still current for this pin. Note that upstream's own nip85-trusted-assertions
# skill does not yet cover 30392-30395 — its 10040/30382 model is unchanged and
# still accurate, the list family simply sits beside it.
quartz = "509075abde"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.1"
# Vespa's official feed client: async document writes multiplexed over HTTP/2.
vespa-feed = "8.714.25"
# Test-only: a mock Vespa must speak h2c for the feed client (JDK HttpServer can't).
# MUST match the Jetty line the feed client itself uses, or its client half breaks.
jetty = "12.0.36"
spotless = "8.8.0"
ktlint = "1.8.0"
# Test-only: spins up a real Vespa container for the CI parity integration test.
testcontainers = "1.20.4"

[libraries]
quartz = { module = "com.github.vitorpamplona.amethyst:quartz", version.ref = "quartz" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vespa-feed-client = { module = "com.yahoo.vespa:vespa-feed-client", version.ref = "vespa-feed" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-http2-server = { module = "org.eclipse.jetty.http2:jetty-http2-server", version.ref = "jetty" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
