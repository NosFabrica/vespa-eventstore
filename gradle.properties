# The daemon's heap. Gradle's default (512 MiB) runs out resolving :bundle:compileClasspath
# (Vespa's container-dev, a wide graph) on a cold dependency cache, which is every CI run that
# changes a version. vespa-relay sets the same.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
