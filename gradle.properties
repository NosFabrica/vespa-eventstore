# The daemon's heap. Gradle's default (512 MiB) runs out resolving :bundle:compileClasspath
# (Vespa's container-dev, a wide graph) on a cold dependency cache, which is every CI run that
# changes a version. vespa-relay sets the same.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Magpie (Nostr + Blossom publishing, beside Maven Central). A release goes to the release key's own
# relays: the write relays of its NIP-65 list (kind 10002) and the ones nosfabrica.com's
# /.well-known/nostr.json lists for it, which is where Magpie consumers look. Index relays are only
# where that relay list is looked up.
magpie.indexRelays=wss://purplepag.es,wss://user.kindpag.es
