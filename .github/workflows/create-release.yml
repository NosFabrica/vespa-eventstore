name: create-release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish to Maven Central
        run: ./gradlew publishAllPublicationsToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  # The same release on Nostr + Blossom, through Magpie's publishToNostr (the plugin version is in
  # settings.gradle.kts, the index relays in gradle.properties): it uploads every file of :engine and
  # :store to the release key's Blossom servers (its kind 10063) and signs one release event (kind
  # 3071) per module, sent to the key's own relays (its kind 10002 and nostr.json). The key never
  # reaches CI: MAGPIE_BUNKER is a NIP-46 bunker:// URI, so the signer approves the release (the job
  # waits for it), and nosfabrica.com/.well-known/nostr.json must name the key as "releases" or
  # Magpie refuses to sign. A version already on Nostr fails the job: releases are immutable. The PGP
  # secrets are here because the publications are signed for Central too.
  nostr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish to Nostr + Blossom
        run: ./gradlew publishToNostr --no-configuration-cache
        env:
          MAGPIE_BUNKER: ${{ secrets.MAGPIE_BUNKER }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
