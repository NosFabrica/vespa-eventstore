name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Spotless
        run: ./gradlew spotlessCheck

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build and test
        run: ./gradlew build

  # Stands up a real Vespa (testcontainers) and asserts this store answers every
  # NIP-01 filter exactly as Quartz's SQLite store — the correctness gate the
  # in-memory reference can't provide (it can't catch a real-Vespa-only
  # divergence). Separate from `build` because it pulls the Vespa image and is
  # slow. ubuntu-latest has a Docker daemon, so it runs (never skips) here.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Vespa ↔ SQLite parity (real Vespa)
        run: ./gradlew :benchmark:test -Pintegration
      # The PROTOTYPE author shards (docs/author-shards.md): the parity battery and the filter
      # matrix again with the corpus split across two content clusters. AuthorShardsIT and
      # AuthorShardsMoveIT already ran above (they deploy their own clusters); this holds the
      # rest of the store to the same answers when sharded, so the off-by-default path cannot
      # rot while nothing in production turns it on.
      - name: The same gates on two author-shard clusters
        run: ./gradlew :benchmark:test -Pintegration -DitAuthorShards=2 --tests '*VespaParityIT' --tests '*FilterMatrixIT'
